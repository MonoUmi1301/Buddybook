sonar.projectKey=buddybook_demo
sonar.projectName=buddybook Demo

# โค้ดจริง — เทสต์แยกไว้ใน sonar.tests (ไฟล์เดียวกันห้ามอยู่ทั้งสองฝั่ง)
sonar.sources=apps,scripts
sonar.tests=apps/api/test,e2e
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,apps/api/test/**,apps/api/prisma/migrations/**

# coverage: รัน `npm run test:coverage` ใน apps/api ก่อนสแกน ไม่งั้นจะขึ้น 0%
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
sonar.javascript.node.maxspace=6144
