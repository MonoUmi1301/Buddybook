# BuddyBook — Nginx บนเครื่อง VPS (ไม่ใช่ container) หน้าบ้านของ docker-compose.prod.yml
#
# เส้นทาง:
#   /api/v1/webhooks/*  → api 127.0.0.1:4000 ตรง (Stripe/Didit — raw body + ลายเซ็น ไม่พึ่ง rewrite ของ Next)
#   /api/v1/internal/*  → 404 (nlp-worker เรียก api:4000 ภายใน docker network เอง ไม่ต้องเปิดออกนอก)
#   ที่เหลือทั้งหมด     → web 127.0.0.1:3000 รวม /api/v1/* — ห้ามส่ง /api ไป Express ตรง: Express รับแค่ Bearer
#                         ส่วน Route Handler ของ Next เป็นตัวแปลง httpOnly cookie เป็น Bearer
#   proxy_pass ไม่มี URI ต่อท้าย = ส่ง path เดิมไปทั้งก้อน (ไม่ตัด /api)
#
# ติดตั้ง (ไฟล์นี้ถูก include ภายใน http {} ของ /etc/nginx/nginx.conf):
#   1. ออกใบรับรองก่อน (ไฟล์นี้อ้าง /etc/letsencrypt/live/buddybook.tech ถ้ายังไม่มี nginx -t จะไม่ผ่าน):
#        sudo certbot certonly --nginx -d buddybook.tech -d www.buddybook.tech
#      certbot.timer ต่ออายุเองและ reload nginx ให้ (authenticator nginx) เช็ค: sudo certbot renew --dry-run
#   2. sudo cp docker/nginx/buddybook.tech.conf /etc/nginx/sites-available/buddybook.tech
#      sudo ln -s /etc/nginx/sites-available/buddybook.tech /etc/nginx/sites-enabled/
#      sudo rm -f /etc/nginx/sites-enabled/default
#   3. sudo nginx -t && sudo systemctl reload nginx

upstream buddybook_web {
  server 127.0.0.1:3000;
  keepalive 16;
}

upstream buddybook_api {
  server 127.0.0.1:4000;
  keepalive 8;
}

# ---- HTTP → HTTPS (ACME challenge ของ certbot --nginx จัดการเองตอนออก/ต่ออายุ) ----
server {
  listen 80;
  listen [::]:80;
  server_name buddybook.tech www.buddybook.tech;
  return 301 https://buddybook.tech$request_uri;
}

# ---- www → apex ----
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.buddybook.tech;
  ssl_certificate /etc/letsencrypt/live/buddybook.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/buddybook.tech/privkey.pem;
  return 301 https://buddybook.tech$request_uri;
}

# ---- เว็บหลัก ----
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name buddybook.tech;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/buddybook.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/buddybook.tech/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:buddybook_ssl:10m;
  ssl_session_timeout 1d;

  # JSON ของ api จำกัดที่ 2MB อยู่แล้ว รูปอัปโหลดตรงไป Cloudinary ไม่ผ่านที่นี่
  client_max_body_size 5m;

  gzip on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # header ที่ส่งให้ทั้ง web และ api — X-Forwarded-For เขียนทับด้วย IP จริง (ไม่ต่อท้ายค่าที่ client ส่งมา)
  # เพราะ api เอาค่าตัวแรกของ XFF ไปนับ view/rate limit ของผู้อ่านที่ไม่ล็อกอิน
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  # Stripe: https://buddybook.tech/api/v1/webhooks/stripe · Didit: /api/v1/webhooks/kyc/didit
  location /api/v1/webhooks/ {
    proxy_request_buffering off;
    proxy_pass http://buddybook_api;
  }

  location /api/v1/internal/ {
    return 404;
  }

  # Swagger UI / OpenAPI spec เปิดสาธารณะอยู่ — ถ้าไม่อยากให้เห็นบน production เอา # ออก
  # location = /api/v1/docs { return 404; }
  # location = /api/v1/openapi.json { return 404; }

  location / {
    proxy_pass http://buddybook_web;
  }
}
