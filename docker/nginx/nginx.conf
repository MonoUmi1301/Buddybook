# BuddyBook — Nginx หน้าบ้าน (container "nginx" ใน docker-compose.prod.yml)
#
# เส้นทาง:
#   /api/v1/webhooks/*  → api:4000 ตรง (Stripe/Didit — raw body + ลายเซ็น ไม่พึ่ง rewrite ของ Next)
#   /api/v1/internal/*  → 404 (nlp-worker เรียก api:4000 ภายใน network เอง ไม่ต้องเปิดออกนอก)
#   ที่เหลือทั้งหมด     → web:3000 รวม /api/v1/* — ห้ามส่ง /api ไป Express ตรง: Express รับแค่ Bearer
#                         ส่วน Route Handler ของ Next เป็นตัวแปลง httpOnly cookie เป็น Bearer
#   proxy_pass ไม่มี URI ต่อท้าย = ส่ง path เดิมไปทั้งก้อน (ไม่ตัด /api)
#
# ใบรับรอง (Let's Encrypt บนเครื่อง VPS) — ออกครั้งแรกก่อนเปิด nginx (พอร์ต 80 ต้องว่าง):
#   sudo certbot certonly --standalone -d buddybook.tech -d www.buddybook.tech
# ต่ออายุ (cron/systemd timer ของ certbot) ใช้ webroot ที่ location /.well-known ด้านล่าง:
#   sudo certbot renew --webroot -w /path/to/buddybook_code/docker/certbot/www \
#     --deploy-hook "docker compose -f /path/to/buddybook_code/docker-compose.prod.yml exec nginx nginx -s reload"

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  # DNS ภายใน Docker — resolve ชื่อ service ใหม่ทุก 10 วิ (container ถูกสร้างใหม่แล้ว IP เปลี่ยนไม่ 502 ค้าง)
  resolver 127.0.0.11 valid=10s ipv6=off;

  # JSON ของ api จำกัดที่ 2MB อยู่แล้ว รูปอัปโหลดตรงไป Cloudinary ไม่ผ่านที่นี่
  client_max_body_size 5m;

  gzip on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # header ที่ส่งให้ทั้ง web และ api — X-Forwarded-For เขียนทับด้วย IP จริง (ไม่ต่อท้ายค่าที่ client ส่งมา)
  # เพราะ api เอาค่าตัวแรกของ XFF ไปนับ view/rate limit ของผู้อ่านที่ไม่ล็อกอิน
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  # ---- HTTP: ACME challenge + redirect ไป HTTPS ----
  server {
    listen 80 default_server;
    server_name buddybook.tech www.buddybook.tech;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://buddybook.tech$request_uri;
    }
  }

  # ---- HTTPS ที่ host อื่น (เช่นเปิดด้วย IP ตรง) — ตัด handshake ทิ้ง ----
  server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
  }

  # ---- www → apex ----
  server {
    listen 443 ssl;
    http2 on;
    server_name www.buddybook.tech;
    ssl_certificate /etc/letsencrypt/live/buddybook.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buddybook.tech/privkey.pem;
    return 301 https://buddybook.tech$request_uri;
  }

  # ---- เว็บหลัก ----
  server {
    listen 443 ssl;
    http2 on;
    server_name buddybook.tech;
    ssl_certificate /etc/letsencrypt/live/buddybook.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buddybook.tech/privkey.pem;

    # ตัวแปร + resolver = ไม่ resolve ชื่อ service ตอน nginx boot (api/web ยังไม่ขึ้นก็ start ได้)
    set $web_upstream http://web:3000;
    set $api_upstream http://api:4000;

    # Stripe: https://buddybook.tech/api/v1/webhooks/stripe · Didit: /api/v1/webhooks/kyc/didit
    location /api/v1/webhooks/ {
      proxy_request_buffering off;
      proxy_pass $api_upstream;
    }

    location /api/v1/internal/ {
      return 404;
    }

    # Swagger UI / OpenAPI spec เปิดสาธารณะอยู่ — ถ้าไม่อยากให้เห็นบน production เอา # ออก
    # location = /api/v1/docs { return 404; }
    # location = /api/v1/openapi.json { return 404; }

    location / {
      proxy_pass $web_upstream;
    }
  }
}
